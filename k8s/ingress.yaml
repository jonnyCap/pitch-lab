apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pitchlab
  namespace: pitchlab
  labels:
    app.kubernetes.io/name: pitchlab
    app.kubernetes.io/part-of: pitchlab
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    # Frontend SPA / PWA
    - host: pitchlab.cloud-test.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pitchlab-frontend
                port:
                  name: http
    # Backend API
    - host: pitchlab-api.cloud-test.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pitchlab-backend
                port:
                  name: http
