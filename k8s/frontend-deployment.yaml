apiVersion: apps/v1
kind: Deployment
metadata:
  name: pitchlab-frontend
  namespace: pitchlab
  labels:
    app.kubernetes.io/name: pitchlab-frontend
    app.kubernetes.io/part-of: pitchlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pitchlab-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pitchlab-frontend
        app.kubernetes.io/part-of: pitchlab
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: pitchlab-frontend
          image: ghcr.io/jonnycap/pitchlab-frontend:9101bea
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
