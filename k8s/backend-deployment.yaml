apiVersion: apps/v1
kind: Deployment
metadata:
  name: pitchlab-backend
  namespace: pitchlab
  labels:
    app.kubernetes.io/name: pitchlab-backend
    app.kubernetes.io/part-of: pitchlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pitchlab-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pitchlab-backend
        app.kubernetes.io/part-of: pitchlab
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pitchlab-backend
          image: ghcr.io/jonnycap/pitchlab-backend:df88a9f
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: POSTGRES_SCHEMA
              value: "pitchlab"
            - name: CORS_ORIGINS
              value: "https://pitchlab.cloud-test.dev"
            - name: PUBLIC_APP_URL
              value: "https://pitchlab.cloud-test.dev"
          envFrom:
            - secretRef:
                name: pitchlab-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
